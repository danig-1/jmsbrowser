[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jmsbrowser"
version = "0.1.0"
description = "Non-consuming curses queue browser and message composer for IBM MQ and Apache Artemis"
requires-python = ">=3.11"
dependencies = [
  "JPype1>=1.7,<2",
  "PyYAML>=6.0.3,<7",
  "wcwidth>=0.2.14,<1",
  "windows-curses>=2.4.1,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
java = ["jdk4py==25.0.2.1"]
dev = ["pytest>=8,<10", "Pillow>=11,<13"]

[project.scripts]
jmsbrowser = "jmsbrowser.cli:main"

[tool.setuptools]
packages = ["jmsbrowser"]

[tool.setuptools.package-data]
jmsbrowser = ["client-lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local Docker brokers and installed JMS clients"]
