# Copy to config.yaml or pass --config config.example.yaml.
# The first two connections match compose.yaml; the third is a TLS-only example.
connections:
  - name: Local Artemis
    type: artemis
    host: localhost
    port: 61616
    username: artemis
    password_env: ARTEMIS_PASSWORD
    # Compose publishes IPv4 loopback; avoid a slow ::1-to-IPv4 fallback on Windows.
    management_url: http://127.0.0.1:8161/console/jolokia
    queue_pattern: DEV.*
    auto_connect: false

  - name: Local IBM MQ
    type: ibm
    host: localhost
    port: 1414
    queue_manager: QM1
    channel: DEV.APP.SVRCONN
    username: app
    password_env: MQ_APP_PASSWORD
    model_queue: DEV.APP.MODEL.QUEUE
    reply_prefix: DEV.JMSBROWSER.*
    queue_pattern: DEV.*
    auto_connect: false

  # External TLS example only; no corresponding broker is created by Compose.
  - name: Artemis TLS (JKS)
    type: artemis
    host: artemis-tls.example.com
    port: 61617
    username: artemis
    password_env: ARTEMIS_TLS_PASSWORD
    management_url: https://artemis-tls.example.com:8162/console/jolokia
    # Management HTTPS uses system CAs; for a private CA, supply a PEM CA file:
    # management_ca_file: C:/certs/artemis-ca.pem
    queue_pattern: DEV.*
    auto_connect: false
    tls:
      enabled: true
      # Replace with the absolute path to your existing JKS truststore.
      trust_store: C:/certs/artemis-truststore.jks
      # Example JKS password: changeit
      # PowerShell: $env:ARTEMIS_JKS_PASSWORD = 'changeit'
      # Bash: export ARTEMIS_JKS_PASSWORD='changeit'
      trust_store_password_env: ARTEMIS_JKS_PASSWORD

ui:
  theme: reader
  browse_limit: 1000  # show the complete local DEV.LOADTEST fixture
  refresh_seconds: 0  # manual refresh by default
  mouse: true
  max_body_bytes: 262144
